<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GBF Copilot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>GBF Copilot</h1>
      <span class="app-version" id="version" aria-label="version"></span>
    </header>

    <main class="app-body">
      <p class="status status--dormant" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Dormant</span>
      </p>
      <p class="status-hint">
        Open a Granblue Fantasy tab to enable session actions.
      </p>
    </main>

    <footer class="app-footer">
      <a href="#" id="open-options">Settings</a>
    </footer>

    <script src="popup.js" defer></script>
  </body>
</html>
